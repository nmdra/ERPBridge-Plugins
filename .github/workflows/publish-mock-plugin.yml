name: Publish mock plugin

on:
  push:
    tags:
      - "mock-plugin-v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nmdra/erpbridge-plugins/mock-plugin

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#mock-plugin-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish mock plugin
        uses: docker/build-push-action@v6
        with:
          context: plugins/mock-plugin
          file: plugins/mock-plugin/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
